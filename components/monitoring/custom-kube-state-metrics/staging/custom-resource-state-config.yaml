apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-kube-state-metrics-config
  namespace: appstudio-monitoring
data:
  custom-resource-state.yaml: |
    spec:
      resources:
        ###############################################################################
        # Add your custom resources below this line
        ###############################################################################
        # Template:
        # - groupVersionKind:
        #     group: "<api-group>"
        #     version: "<version>"
        #     kind: "<Kind>"
        #   labelsFromPath:
        #     name: [metadata, name]
        #     namespace: [metadata, namespace]  # omit for cluster-scoped
        #   metrics:
        #     - name: "<metric_name>"
        #       help: "<description>"
        #       each:
        #         type: Gauge  # or StateSet, Info
        #         gauge:
        #           path: [status, someField]
        #           nilIsZero: true

        ###############################################################################
        # Velero Schedules
        ###############################################################################
        - groupVersionKind:
            group: "velero.io"
            version: "v1"
            kind: "Schedule"
          labelsFromPath:
            schedule: [metadata, name]
            namespace: [metadata, namespace]
          metrics:
            - name: "velero_schedule_paused"
              help: "Whether the Velero schedule is paused (1 = paused, 0 = active)"
              each:
                type: Gauge
                gauge:
                  path: [spec, paused]
                  nilIsZero: true
            - name: "velero_schedule_last_backup"
              help: "status.lastBackup as Unix seconds; 0 if unset (UI n/a)."
              each:
                type: Gauge
                gauge:
                  path: [status, lastBackup]
                  nilIsZero: true

        ###############################################################################
        # PipelineRuns — one GVK only (KSM cannot register the same GVK twice).
        # Resource-level labels are inherited by every metric below; keep that set
        # small. High-cardinality identity labels belong on konflux_pipelinerun_info
        # only so the hanging-PR metric is unchanged for RHOBS federation.
        ###############################################################################
        - groupVersionKind:
            group: "tekton.dev"
            version: "v1"
            kind: "PipelineRun"
          labelsFromPath:
            namespace: [metadata, namespace]
          metrics:
            - name: "konflux_pipelinerun_deletion_timestamp_seconds"
              help: "Unix timestamp when deletion was requested (0 = not deleted). Use > 0 to find stuck PipelineRuns."
              labelsFromPath:
                pipelinerun: [metadata, name]
                pipeline: [metadata, labels, tekton.dev/pipeline]
                finalizers: [metadata, finalizers]
              each:
                type: Gauge
                gauge:
                  path: [metadata, deletionTimestamp]
                  nilIsZero: true
            # High cardinality (one series per live PipelineRun). Scraped by UWM
            # for on-cluster queries; excluded from OBO federation / RHOBS.
            # Test PipelineRuns use pac.test.appstudio.openshift.io/sha; the
            # ServiceMonitor copies a non-empty pac_test_commit_sha onto commit_sha.
            - name: "konflux_pipelinerun_info"
              help: "Konflux PipelineRun identity. Value is metadata.generation."
              labelsFromPath:
                pipelinerun: [metadata, name]
                application: [metadata, labels, appstudio.openshift.io/application]
                component: [metadata, labels, appstudio.openshift.io/component]
                pipeline_type: [metadata, labels, pipelines.appstudio.openshift.io/type]
                commit_sha: [metadata, labels, pipelinesascode.tekton.dev/sha]
                pac_test_commit_sha: [metadata, labels, pac.test.appstudio.openshift.io/sha]
              each:
                type: Gauge
                gauge:
                  path: [metadata, generation]
                  nilIsZero: true
